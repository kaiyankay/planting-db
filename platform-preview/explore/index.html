<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore · Knowledge · Planting Intelligence</title>
<meta name="description" content="Search the plant knowledge and open one view at a time: a relationship graph you expand on purpose, the species by spatial function matrix, the attribute table and a two-plant comparison, each with the evidence behind every line.">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap">
<link rel="stylesheet" href="../platform/css/platform.css">
<style>
  /* The Explorer's own layout over the platform tokens (DESIGN.md). One working view at a time; the evidence inspector is a
     contextual panel on the right; the start screen is the default entry. */
  :root {
    --bg: var(--pi-ivory); --panel: var(--pi-paper); --panel-2: var(--pi-paper-2); --ink: var(--pi-ink); --ink-2: var(--pi-ink-2); --ink-3: var(--pi-ink-3); --line: var(--pi-line); --line-2: var(--pi-line-2);
    --olive: var(--pi-olive); --olive-deep: var(--pi-olive-deep); --olive-soft: var(--pi-olive-soft); --sage: var(--pi-sage); --amber: var(--pi-caramel); --amber-ink: var(--pi-caramel-ink); --amber-soft: var(--pi-caramel-soft); --rust: var(--pi-rust); --rust-soft: var(--pi-rust-soft);
    --sans: var(--pi-sans); --mono: var(--pi-mono); --display: var(--pi-display); --ease: var(--pi-ease);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  ::selection { background: var(--olive-soft); color: var(--ink); }
  a { color: var(--olive-deep); text-decoration: underline; text-decoration-color: rgba(59,85,56,.35); text-underline-offset: 3px; } a:hover { text-decoration-color: currentColor; }
  i.sci, em { font-style: italic; }
  h1, h2, h3, h4 { margin: 0; font-weight: 500; }
  button { font: 13px/1.2 var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 12px; cursor: pointer; transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease); }
  button:hover { border-color: var(--ink-2); background: #fff; } button:disabled { opacity: .45; cursor: default; }
  input, select { font: 13px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 9px; outline: none; accent-color: var(--olive-deep); } input:focus, select:focus { border-color: var(--olive-deep); }
  :focus-visible { outline: 2px solid var(--olive-deep); outline-offset: 2px; border-radius: 4px; }
  svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 12px; } .mono { font: 11px var(--mono); } .warn { color: var(--rust); } .cond { color: var(--amber-ink); }
  .pi-tag { margin-right: 3px; } .pi-tag.retired, .pi-tag.contradicted, .pi-tag.contradicted_by_traits { color: var(--rust); background: var(--rust-soft); border-color: transparent; } .pi-tag.evidence_missing, .pi-tag.model_placeholder { color: var(--amber-ink); border-color: var(--amber); border-style: dashed; } .pi-tag.toconfirm { color: var(--amber-ink); border-color: var(--amber-ink); border-style: dotted; }
  .pi-tag.A { background: var(--olive-deep); color: var(--panel); border-color: var(--olive-deep); } .pi-tag.B { background: var(--amber-ink); color: var(--panel); border-color: var(--amber-ink); }
  .chip { display: inline-flex; align-items: center; gap: 5px; font: 12px/1.3 var(--sans); padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--ink); cursor: pointer; margin: 2px 3px 2px 0; } .chip:hover { border-color: var(--ink-2); background: #fff; } .chip small { font: 10.5px var(--mono); color: var(--ink-3); }
  .note { font-size: 12px; line-height: 1.5; color: var(--ink-2); margin: 10px 0 0; }
  .link { color: var(--olive-deep); cursor: pointer; text-decoration: underline; text-decoration-color: rgba(59,85,56,.35); text-underline-offset: 3px; } .link:hover { text-decoration-color: currentColor; }
  details { margin: 6px 0; } summary { cursor: pointer; color: var(--ink-2); font-size: 12px; } summary:hover { color: var(--ink); }

  /* ---- toolbar: start · search · the four views · what is focused · how to read */
  #pitop { flex: none; }
  #bar { flex: none; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); } #bar[hidden] { display: none; }
  #home { border: 0; background: none; padding: 6px 6px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; } #home:hover { color: var(--ink); background: none; }
  .searchbox { position: relative; width: 280px; flex: none; } .searchbox svg.ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
  .searchbox input { width: 100%; height: 34px; padding: 0 34px 0 32px; } .searchbox kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; pointer-events: none; }
  .results { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 6px 20px rgba(39,36,31,.08); display: none; max-height: 340px; overflow: auto; z-index: 20; text-align: left; }
  .results.open { display: block; } .results div { padding: 7px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; } .results div:hover, .results div.hi { background: var(--panel-2); } .results small { font: 11px var(--mono); color: var(--ink-3); flex: none; } .results .none { cursor: default; color: var(--ink-3); } .results .none:hover { background: none; }
  #views { display: flex; gap: 2px; } #views button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); padding: 7px 11px; }
  #views button:hover { color: var(--ink); background: var(--panel-2); } #views button[aria-pressed="true"] { background: var(--olive-deep); color: var(--panel); }
  #crumb { display: flex; align-items: center; gap: 14px; min-width: 0; margin-left: 4px; font-size: 13px; color: var(--ink-2); }
  #crumb .c { display: inline-flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; } #crumb .c b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; cursor: pointer; } #crumb .c b:hover { text-decoration: underline; text-underline-offset: 3px; }
  #crumb .x { border: 0; background: none; padding: 3px; border-radius: 50%; color: var(--ink-3); display: inline-grid; place-items: center; } #crumb .x:hover { color: var(--ink); background: var(--panel-2); } #crumb .x svg.ic { width: 13px; height: 13px; }
  #how { margin: 0 0 0 auto; position: relative; flex: none; } #how > summary { list-style: none; font-size: 13px; color: var(--ink-2); padding: 7px 4px; white-space: nowrap; } #how > summary::-webkit-details-marker { display: none; } #how > summary:hover, #how[open] > summary { color: var(--ink); }
  #howbody { position: absolute; right: 0; top: 100%; margin-top: 8px; width: 420px; max-height: calc(100vh - 150px); overflow: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 6px 20px rgba(39,36,31,.08); padding: 16px 18px 18px; z-index: 30; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
  #howbody h3 { font: 600 11px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; } #howbody h3:first-child { margin-top: 0; } #howbody p { margin: 4px 0; } #howbody b { color: var(--ink); font-weight: 600; }
  #howbody .lg i { display: inline-block; width: 22px; border-top: 2px solid var(--olive-deep); vertical-align: middle; margin-right: 8px; } #howbody .lg i.derived { border-top-style: dashed; } #howbody .lg i.candidate { border-top: 2px dashed var(--amber); } #howbody .lg i.unknown { border-top: 2px dotted var(--ink-3); } #howbody .lg i.rel { border-top: 2px solid var(--ink); } #howbody .lg i.trait { border-top: 1px solid var(--sage); }

  /* ---- frame: the working view and, when something is selected, the evidence panel */
  #main { flex: 1; min-height: 0; display: flex; }
  #start, #stage { flex: 1; min-width: 0; } #start[hidden], #stage[hidden], #inspector[hidden], .view[hidden] { display: none; }
  #stage { display: flex; flex-direction: column; min-height: 0; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .vhead { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-height: 48px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .vhead h2 { font: 600 13.5px/1.3 var(--sans); white-space: nowrap; } .vhead .sub { font-size: 12.5px; color: var(--ink-3); } .vhead .right { margin-left: auto; display: flex; gap: 6px; align-items: center; order: 2; }
  .vhead label { font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; white-space: nowrap; }
  .vbody { flex: 1; min-height: 0; overflow: auto; }
  #inspector { flex: none; width: 400px; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  #inspector > header { flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--line); } #inspector > header span.l { font: 600 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); } #isub { font-size: 12px; color: var(--ink-3); }
  #iclose { margin-left: auto; border: 0; background: none; padding: 7px; border-radius: 8px; color: var(--ink-2); display: inline-grid; place-items: center; } #iclose:hover { color: var(--ink); background: var(--panel-2); }
  #ibody { flex: 1; min-height: 0; overflow: auto; padding: 18px 18px 28px; }

  /* ---- start: search first, then three ways in */
  #start { overflow: auto; }
  .start { max-width: 1216px; margin: 0 auto; padding: 40px 32px 40px; }
  .start h1 { font: 400 clamp(34px, 3.4vw, 46px)/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; } .start h1 em { color: var(--olive-deep); }
  .start .lede { margin: 12px 0 0; max-width: 72ch; font-size: 15.5px; line-height: 1.55; color: var(--ink-2); }
  .start .searchbox { width: min(640px, 100%); margin-top: 24px; } .start .searchbox input { height: 52px; font-size: 16px; padding: 0 46px 0 44px; background: var(--panel); } .start .searchbox svg.ic { left: 15px; width: 18px; height: 18px; } .start .searchbox kbd { right: 14px; }
  .start .prov { margin: 12px 0 0; font: 11.5px/1.6 var(--mono); color: var(--ink-3); }
  .ways { display: grid; grid-template-columns: minmax(0, 9fr) minmax(0, 7fr) minmax(0, 7fr); gap: 32px 48px; margin-top: 36px; align-items: start; }
  .ways h2 { font: 600 14px/1.3 var(--sans); padding-bottom: 9px; border-bottom: 1px solid var(--line-2); }
  .srow { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 2px 14px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; cursor: pointer; }
  .srow b { font-weight: 600; font-size: 14px; } .srow span { color: var(--ink-2); font-size: 13px; line-height: 1.45; } .srow small { grid-column: 2; font: 11px/1.5 var(--mono); color: var(--ink-3); } .srow:hover b, .prow:hover i { color: var(--olive-deep); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(59,85,56,.4); }
  .srow.wide { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 12px 0; } .srow.wide b { font-weight: 500; line-height: 1.4; } .srow.wide small { grid-column: 1; }
  .prow { display: flex; align-items: baseline; gap: 9px; padding: 8px 0 7px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; cursor: pointer; } .prow i { flex: none; font: italic 400 16.5px/1.25 var(--display); } .prow span { min-width: 0; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .start .every { margin: 24px 0 0; font-size: 13px; color: var(--ink-2); }

  /* ---- graph */
  #gbody { position: relative; overflow: hidden; } #svg { width: 100%; height: 100%; display: block; cursor: grab; } #svg.dragging { cursor: grabbing; }
  #svg text { font-family: var(--sans); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; fill: var(--ink); }
  #svg .node { cursor: pointer; } #svg .node circle { transition: r .2s var(--ease); } #svg .node.species circle { fill: #e6ebe0; stroke: var(--olive); stroke-width: 1.5; } #svg .node.species.focus circle { fill: var(--olive); } #svg .node.focus text { font-weight: 600; }
  #svg .node.function circle { fill: var(--olive-deep); stroke: var(--olive-deep); } #svg .node.function text { font-weight: 600; } #svg .node.concept circle { fill: var(--panel); stroke: var(--sage); stroke-width: 1.2; } #svg .node.concept text { fill: var(--ink-2); }
  #svg .node.ghost circle { fill: none; stroke: var(--ink-3); stroke-dasharray: 2 2; } #svg .node.ghost text { fill: var(--ink-3); font-weight: 400; }
  #svg .node.a circle { stroke: var(--olive-deep); stroke-width: 3; } #svg .node.b circle { stroke: var(--amber-ink); stroke-width: 3; }
  #svg .edge { fill: none; stroke: var(--olive-deep); stroke-width: 1.4; cursor: pointer; stroke-opacity: .75; } #svg .edge.derived { stroke-dasharray: 7 3; } #svg .edge.candidate { stroke: var(--amber); stroke-dasharray: 3 3; } #svg .edge.conflict { stroke: var(--rust); } #svg .edge.has_trait, #svg .edge.grows_in { stroke: var(--sage); stroke-width: 1; stroke-opacity: .6; } #svg .edge.requires_trait { stroke: var(--olive-deep); stroke-dasharray: 1.5 3; stroke-width: 1.2; } #svg .edge.relation { stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: none; } #svg .edge.relation.candidate { stroke: var(--ink); stroke-dasharray: 3 3; opacity: .7; }
  #svg .edge.hit { stroke: transparent; stroke-width: 10; stroke-opacity: 0; } #svg .edge.sel { stroke-width: 3; stroke-opacity: 1; } #svg .edge.dim { stroke-opacity: .15; }
  #svg .elabel { font-size: 9.5px; fill: var(--ink-3); font-family: var(--mono); font-weight: 400; }
  #gnote { position: absolute; left: 16px; top: 10px; right: 16px; margin: 0; font-size: 12px; color: var(--ink-3); pointer-events: none; }
  .layers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; } .layers.many { order: 3; flex-basis: 100%; padding-bottom: 2px; } .layers .lab { font-size: 12.5px; color: var(--ink-3); margin-right: 2px; } .layers .lab + .layer { margin-left: 0; } .layers .gap { width: 8px; }
  .layer { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 8px; font-size: 12.5px; border-style: dashed; background: transparent; color: var(--ink-2); } .layer svg.ic { width: 13px; height: 13px; } .layer small { font: 10.5px var(--mono); color: var(--ink-3); }
  .layer:hover { color: var(--ink); } .layer[aria-pressed="true"] { border-style: solid; border-color: var(--olive-deep); background: var(--olive-soft); color: var(--olive-deep); } .layer[aria-pressed="true"] small { color: var(--olive-deep); }
  #tip { position: fixed; display: none; pointer-events: none; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 10px; font-size: 12px; max-width: 320px; z-index: 30; box-shadow: 0 6px 20px rgba(39,36,31,.08); } #tip .m { font: 10.5px var(--mono); color: var(--ink-3); }

  /* ---- matrix */
  #mbody { padding: 4px 16px 20px; background: var(--panel); }
  table.matrix { border-collapse: collapse; width: 100%; max-width: 1180px; font-size: 13px; } table.matrix th, table.matrix td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  table.matrix thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; font: 600 13px/1.3 var(--sans); color: var(--ink); cursor: pointer; text-align: center; vertical-align: bottom; border-bottom-color: var(--line-2); } table.matrix thead th:first-child { text-align: left; font: 600 11px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); cursor: default; }
  table.matrix thead th small { display: block; margin-top: 2px; font: 10.5px var(--mono); color: var(--ink-3); font-weight: 400; white-space: nowrap; } table.matrix thead th:hover { color: var(--olive-deep); } table.matrix thead th.focus { color: var(--olive-deep); box-shadow: inset 0 -2px 0 var(--olive-deep); }
  table.matrix tbody th { font-weight: 400; cursor: pointer; white-space: nowrap; } table.matrix tbody th i.sci { font: italic 400 15.5px/1.2 var(--display); } table.matrix tbody th span.cn { margin-left: 8px; font-size: 12px; color: var(--ink-3); } table.matrix tbody th:hover i.sci { color: var(--olive-deep); } table.matrix tbody tr.focus th i.sci { color: var(--olive-deep); } table.matrix tbody tr.focus { box-shadow: inset 2px 0 0 var(--olive-deep); }
  table.matrix td { text-align: center; cursor: pointer; line-height: 1.1; } table.matrix td.focus { background: rgba(91,122,87,.07); } table.matrix td.sel { outline: 2px solid var(--olive-deep); outline-offset: -2px; border-radius: 6px; }
  table.matrix .cell { display: inline-flex; align-items: center; gap: 4px; font: 11px/1.4 var(--mono); padding: 2px 9px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; } table.matrix td:hover .cell { border-color: var(--line-2); }
  table.matrix .cell.derived { background: var(--olive-soft); color: var(--olive-deep); } table.matrix .cell.candidate { background: var(--amber-soft); color: var(--amber-ink); } table.matrix .cell.unknown { color: var(--ink-3); } table.matrix .cell.unknown.contradicted { color: var(--ink-2); } table.matrix .cell.conflict { box-shadow: inset 0 0 0 1px var(--rust); color: var(--rust); }
  table.matrix .cell .v { color: var(--olive-deep); font-weight: 600; }
  #mlegend { max-width: 1180px; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 28px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); } #mlegend b { font: 11px var(--mono); color: var(--ink); font-weight: 400; }

  /* ---- attribute table */
  #tablewrap { background: var(--panel); }
  table.attr { border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: 100%; } table.attr th, table.attr td { padding: 5px 9px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: middle; text-align: left; white-space: nowrap; }
  table.attr thead th { position: sticky; top: 0; background: var(--panel); z-index: 3; font: 600 11px/1.3 var(--sans); letter-spacing: .04em; color: var(--ink-2); white-space: nowrap; cursor: pointer; } table.attr thead tr.groups th { top: 0; height: 26px; color: var(--ink-3); border-bottom: 0; text-align: center; letter-spacing: .06em; text-transform: uppercase; cursor: default; } table.attr thead tr.cols th { top: 26px; border-bottom-color: var(--line-2); }
  table.attr thead th.req { color: var(--olive-deep); background: var(--olive-soft); } table.attr thead th.sorted { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); } table.attr thead th .g { font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
  table.attr tbody th { position: sticky; left: 0; background: var(--panel); z-index: 2; font-weight: 400; white-space: nowrap; cursor: pointer; } table.attr thead th:first-child { left: 0; z-index: 4; } table.attr tbody th i.sci { font: italic 400 14.5px/1.2 var(--display); } table.attr tbody th:hover { color: var(--olive-deep); } table.attr tbody tr.focus th { color: var(--olive-deep); background: var(--olive-soft); } table.attr tbody tr.linked th .st { font: 10px var(--mono); color: var(--olive-deep); margin-left: 7px; } table.attr tbody tr.unknown-fn th .st { font: 10px var(--mono); color: var(--ink-3); margin-left: 7px; }
  table.attr td { cursor: pointer; } table.attr td:hover { background: #fff; } table.attr td.req { background: rgba(91,122,87,.06); } table.attr td.sel { outline: 2px solid var(--olive-deep); outline-offset: -2px; } table.attr td.nr { color: var(--ink-3); font-style: italic; cursor: default; }
  table.attr td .v { display: inline-block; margin: 1px 5px 1px 0; } table.attr td .v small { font: 10px var(--mono); color: var(--ink-3); } table.attr td .dis { font: 10px var(--mono); color: var(--rust); } table.attr td .ver { font: 10px var(--mono); color: var(--olive-deep); }
  table.attr td.ident { color: var(--ink-2); }

  /* ---- comparison */
  #chead select { min-width: 220px; font-style: italic; } #chead label { color: var(--ink-3); }
  #cbody { padding: 22px 24px 40px; background: var(--panel); }
  .cmp-h { max-width: 1280px; margin: 0 0 6px; } .cmp-h h2 { font: 400 26px/1.15 var(--display); letter-spacing: -.012em; } .cmp-h h2 .amp { color: var(--ink-3); font-style: normal; margin: 0 6px; } .cmp-h p { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3); }
  .cmp-grid { max-width: 1280px; display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 0 48px; align-items: start; }
  .csec { padding-top: 22px; } .csec h3 { font: 600 14px/1.3 var(--sans); padding-bottom: 8px; border-bottom: 1px solid var(--line-2); } .csec h3 small { font: 12px var(--sans); font-weight: 400; color: var(--ink-3); margin-left: 6px; } .csec > p { margin: 8px 0; }

<body>

    <div class="view" id="v-table" hidden><div class="vhead" id="tcontrols"></div><div class="vbody" id="tablewrap"></div></div>
    <div class="view" id="v-compare" hidden><div class="vhead" id="chead"></div><div class="vbody" id="cbody"></div></div>

    <header><span class="l">Evidence</span><span id="isub"></span><button id="iclose" data-act="close-insp" aria-label="Close the evidence panel" title="Close (Esc)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></header>
    <div id="ibody"></div>
  </aside>
</main>
