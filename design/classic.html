<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planting Intelligence · Design Workspace (classic)</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f4f2ea; --panel: rgba(253,251,247,.94); --panel-2: #f0ece2; --ink: #2a2723; --ink-2: #5f5a52; --ink-3: #9a948a; --line: rgba(42,39,35,.12); --line-2: rgba(42,39,35,.24);
    --olive: #5f7f62; --olive-deep: #44604a; --olive-soft: #dfe7dc; --sage: #8a9a80; --amber: #c08a2e; --amber-soft: #f3e4c6; --rust: #b4553a; --rust-soft: #f1dcd5; --violet: #7c6ea8; --sky: #4a7da5;
    --sans: -apple-system, "Helvetica Neue", "Segoe UI", Inter, Roboto, sans-serif; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --shadow: 0 10px 34px rgba(42,39,35,.12); }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: var(--olive-deep); } i.sci { font-style: italic; } h1, h2, h3, h4 { margin: 0; font-weight: 500; }
  button { font: 12px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; } button:hover { background: #fff; border-color: var(--line-2); } button.on { background: var(--olive-deep); border-color: var(--olive-deep); color: #fff; font-weight: 500; } button.primary { background: var(--olive-deep); color: #fff; border-color: var(--olive-deep); } button.primary:hover { background: var(--olive); } button:disabled { opacity: .45; cursor: default; } button.mini { padding: 1px 6px; font-size: 10.5px; border-radius: 4px; } button.danger { color: var(--rust); border-color: var(--rust); } button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); } button.ghost:hover { background: rgba(255,255,255,.7); }
  input, select, textarea { font: 12.5px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none; } input:focus, select:focus, textarea:focus { border-color: var(--line-2); } input[type=range] { padding: 0; } input.num { width: 64px; }
  .kicker { font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); } .muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 11.5px; } .mono { font-family: var(--mono); font-size: 10.5px; } .warn { color: var(--rust); } .ok { color: var(--olive-deep); }
  .tag { display: inline-block; font: 10px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; vertical-align: middle; margin-right: 3px; }
  .tag.pass, .tag.documented, .tag.verified, .tag.user-stated, .tag.user-drawn, .tag.user-calibrated, .tag.user-accepted, .tag.supported_by_source { color: var(--olive-deep); border-color: var(--olive); } .tag.derived { color: var(--olive-deep); border-style: dashed; } .tag.candidate, .tag.conditional, .tag.assumed, .tag.inferred, .tag.unverified, .tag.partially_supported, .tag.interpretation_candidate { color: #8a6a1f; border-color: var(--amber); border-style: dashed; } .tag.unknown, .tag.not_recorded, .tag.not_assessed, .tag.none { color: var(--ink-3); border-style: dotted; } .tag.fail, .tag.conflict, .tag.error, .tag.refused, .tag.retired, .tag.conflicting_evidence, .tag.flag { color: var(--rust); background: var(--rust-soft); border-color: transparent; } .tag.offline { background: var(--panel-2); border-color: transparent; } .tag.live { background: var(--olive-soft); border-color: transparent; color: var(--olive-deep); }
  .note { font-size: 11.5px; color: var(--ink-2); background: rgba(255,255,255,.6); border-left: 2px solid var(--line-2); padding: 6px 9px; margin: 6px 0; border-radius: 0 6px 6px 0; } .note.warn { border-left-color: var(--rust); }
  details { margin: 4px 0; } summary { cursor: pointer; color: var(--ink-2); font-size: 11.5px; } summary:hover { color: var(--ink); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.7); margin: 2px 2px 2px 0; } .chip.click { cursor: pointer; } .chip.click:hover { border-color: var(--line-2); background: #fff; } .chip small { font: 10px var(--mono); color: var(--ink-3); }
  .row { display: flex; gap: 8px; align-items: center; } .row.between { justify-content: space-between; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
  table.t { border-collapse: collapse; width: 100%; font-size: 11.5px; } table.t th, table.t td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; } table.t th { font: 10px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; } table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--panel-2); } table.t tr.sel td { background: var(--olive-soft); }

  /* ---- the stage: the canvas is the page */
  #stage { position: fixed; inset: 0; } #svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); touch-action: none; } #gl { position: absolute; inset: 0; display: none; } #gl canvas { display: block; }
  #svg.tool-draw, #svg.tool-lasso, #svg.tool-tree, #svg.tool-open, #svg.tool-bed, #svg.tool-site, #svg.tool-calibrate, #svg.tool-add { cursor: crosshair; } #svg.panning { cursor: grabbing; }
  #svg text { font-family: var(--sans); paint-order: stroke; stroke: rgba(244,242,234,.9); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
  #svg .site { fill: rgba(255,255,255,.4); stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 6 3; } #svg .site.present { fill: #dfe3cf; stroke: #9a948a; stroke-dasharray: none; stroke-width: 1; }
  #svg .bed { fill: rgba(95,127,98,.08); stroke: var(--olive); stroke-width: 1.2; } #svg .bed.present { fill: #b9a082; stroke: #8a7558; stroke-width: 1; } #svg .bed.suggested { stroke-dasharray: 4 3; fill: rgba(192,138,46,.08); stroke: var(--amber); } #svg .bed.active { stroke-width: 2; }
  #svg .open { fill: rgba(42,39,35,.05); stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; } #svg .open.present { fill: #e8e4d8; stroke: #c9c2b3; stroke-dasharray: none; } #svg .tree { fill: rgba(68,96,74,.12); stroke: var(--olive-deep); stroke-width: 1; stroke-dasharray: 2 3; } #svg .tree-centre { fill: var(--olive-deep); }
  #svg .zone { fill: none; stroke: var(--sky); stroke-width: 1; stroke-dasharray: 2 4; opacity: .7; } #svg .zone-label { font-size: 9.5px; fill: var(--sky); font-family: var(--mono); }
  #svg .plant { cursor: pointer; } #svg .plant.locked { cursor: default; } #svg .plant .ring { fill: none; stroke: var(--ink); stroke-width: 2; } #svg .plant.target .ring { stroke: var(--amber); } #svg .plant.added .ring { stroke: var(--olive-deep); stroke-width: 2.6; } #svg .plant.changed .ring { stroke: var(--violet); } #svg .plant.removed { fill: rgba(180,85,58,.12); stroke: var(--rust); stroke-dasharray: 3 2; stroke-width: 1.6; }
  #svg .plant-label { font-size: 8.5px; fill: var(--ink-2); } #svg .scope { fill: rgba(192,138,46,.12); stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 6 3; } #svg .lasso { fill: rgba(192,138,46,.1); stroke: var(--amber); stroke-width: 1.5; } #svg .draft { fill: rgba(95,127,98,.08); stroke: var(--olive); stroke-width: 1.2; stroke-dasharray: 4 3; }
  #svg .scalebar { stroke: var(--ink-2); stroke-width: 2; } #svg .north { fill: var(--ink-2); } #svg .overlay { opacity: .55; }
  #tip { position: fixed; display: none; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font-size: 11.5px; max-width: 320px; z-index: 30; box-shadow: 0 4px 14px rgba(42,39,35,.12); } #tip .m { font: 10px var(--mono); color: var(--ink-3); }

  /* ---- floating chrome */
  .float { position: fixed; background: var(--panel); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 5; }
  #top { top: 12px; left: 14px; right: 14px; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; z-index: 6; }
  #top h1 { font: 500 15px/1 var(--serif); letter-spacing: .01em; white-space: nowrap; } #top h1 small { font: 10px var(--mono); color: var(--ink-3); letter-spacing: .12em; text-transform: uppercase; margin-left: 8px; }
  #top .crumbs { font: 11px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; } #top .right { margin-left: auto; display: flex; gap: 6px; align-items: center; } #pname { width: 150px; }
  #left, #right { top: 66px; bottom: 74px; width: 348px; display: flex; flex-direction: column; min-height: 0; transition: transform .25s ease, opacity .25s ease; } #left { left: 14px; } #right { right: 14px; width: 360px; }
  #left.closed { transform: translateX(-110%); opacity: 0; pointer-events: none; } #right.closed { transform: translateX(110%); opacity: 0; pointer-events: none; }
  .float > .head { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; border-bottom: 1px solid var(--line); } .float > .head h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); } .float > .head .sub { font-size: 11px; color: var(--ink-3); } .float > .head .right { margin-left: auto; display: flex; gap: 5px; align-items: center; }
  .float > .body { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px 12px; }
  #edge-left, #edge-right { position: fixed; top: 50%; transform: translateY(-50%); z-index: 7; writing-mode: vertical-rl; font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 12px 6px; border-radius: 8px; } #edge-left { left: 10px; } #edge-right { right: 10px; } #edge-left.hidden, #edge-right.hidden { display: none; }
  #bottom { left: 14px; right: 14px; bottom: 12px; height: 50px; display: flex; flex-direction: column; min-height: 0; transition: height .25s ease; } #bottom.open { height: 300px; } #bottom .head { cursor: pointer; } #bottom .tabs { display: flex; gap: 4px; } #bottom .tabs button.on { background: var(--olive-soft); color: var(--olive-deep); border-color: var(--olive); } #bottom .body { display: none; } #bottom.open .body { display: block; }
  #tools { position: fixed; left: 376px; top: 66px; display: flex; gap: 4px; flex-wrap: wrap; z-index: 5; max-width: 60vw; transition: left .25s ease; } body.left-closed #tools { left: 44px; } #tools button { background: var(--panel); backdrop-filter: blur(8px); } #tools .sep { width: 1px; background: var(--line); margin: 0 3px; }
  #quick { position: fixed; right: 388px; top: 66px; z-index: 5; display: flex; gap: 4px; align-items: center; font-size: 11.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; transition: right .25s ease; } body.right-closed #quick { right: 44px; } #quick input { width: 52px; }
  #viewbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 74px; display: flex; gap: 4px; align-items: center; padding: 5px; z-index: 6; } #viewbar button { border-color: transparent; background: transparent; } #viewbar button.on { background: var(--olive-deep); color: #fff; } #viewbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  #legend { position: fixed; left: 50%; transform: translateX(-50%); bottom: 122px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 60vw; font: 10.5px var(--mono); color: var(--ink-2); z-index: 4; pointer-events: none; } #legend span { background: var(--panel); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); } #legend svg { vertical-align: middle; margin-right: 3px; }
  #cfoot { position: fixed; right: 14px; bottom: 74px; font: 10.5px var(--mono); color: var(--ink-3); z-index: 4; pointer-events: none; transition: right .25s ease; } body:not(.right-closed) #cfoot { right: 388px; }

  /* conversation */
  #chatlog { display: flex; flex-direction: column; gap: 8px; } .msg { padding: 8px 10px; border-radius: 10px; font-size: 12.5px; max-width: 96%; } .msg.user { background: var(--amber-soft); align-self: flex-end; } .msg.ai { background: var(--olive-soft); align-self: flex-start; } .msg.sys { background: var(--panel-2); align-self: stretch; font-size: 11.5px; color: var(--ink-2); } .msg .m { font: 10px var(--mono); color: var(--ink-3); margin-top: 4px; } .msg ul { margin: 4px 0 0 16px; padding: 0; } .msg li { margin: 1px 0; }
  #chatform { flex: none; padding: 8px 12px 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; } #chatform textarea { width: 100%; min-height: 54px; resize: vertical; } #chatform .row { gap: 5px; flex-wrap: wrap; } #chatform .hint { font: 10.5px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #brief { padding: 6px 12px 10px; border-top: 1px solid var(--line); flex: none; max-height: 40%; overflow: auto; } #brief h3 { font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 6px 0 4px; } .vrow { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 6px; font-size: 11.5px; margin: 2px 0; } .vrow input[type=range] { width: 100%; }
  /* rail */
  .sec { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: rgba(255,255,255,.5); } .sec > .h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); } .sec > .h .n { margin-left: auto; font: 10px var(--mono); color: var(--ink-3); text-transform: none; letter-spacing: 0; } .sec > .c { display: none; padding: 2px 10px 10px; border-top: 1px solid var(--line); font-size: 12px; } .sec.open > .c { display: block; } .sec.active > .h { color: var(--olive-deep); background: var(--olive-soft); border-radius: 8px 8px 0 0; }
  .field { display: grid; grid-template-columns: 84px 1fr; gap: 4px 8px; align-items: center; font-size: 11.5px; margin: 3px 0; } .field label { color: var(--ink-2); } .field .v { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; } .field select { padding: 1px 4px; font-size: 11px; max-width: 118px; }
  .why { font-size: 11.5px; padding: 5px 0; border-top: 1px solid var(--line); } .why b { font-weight: 500; } .why .m { font: 10.5px var(--mono); color: var(--ink-3); }
  .preview { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 12px; } .preview h4 { font-size: 12px; margin-bottom: 4px; } .preview .btns { display: flex; gap: 6px; margin-top: 6px; }
  .claim { padding: 5px 0; border-top: 1px solid var(--line); font-size: 11.5px; } .claim .m { font: 10.5px var(--mono); color: var(--ink-3); margin-top: 2px; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #plantcard { position: fixed; right: 388px; bottom: 74px; width: 300px; max-height: 46vh; overflow: auto; padding: 10px 12px; display: none; z-index: 6; transition: right .25s ease; } body.right-closed #plantcard { right: 44px; } #plantcard.open { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink-3); font: 12px var(--mono); background: var(--bg); z-index: 50; } #loading.gone { display: none; } #err { color: var(--rust); white-space: pre-wrap; max-width: 600px; }
  @media (max-width: 1100px) { #left, #right { width: 300px; } #tools { left: 328px; } #quick { right: 328px; } }
  @media (max-width: 820px) { #left, #right { width: min(92vw, 360px); } #left:not(.closed) ~ #right { display: none; } #viewbar { bottom: 70px; } #legend { display: none; } }
</style>
<script type="importmap">{ "imports": { "three": "../brain/vendor/three/three.module.js", "three/addons/": "../brain/vendor/three/examples/jsm/" } }</script>
</head>
<body>
<div id="stage"><svg id="svg"></svg><div id="gl"></div></div>
<div class="float" id="top">
  <h1>Planting Intelligence <small>design workspace</small></h1>
  <span class="crumbs" id="crumbs">Site</span>
  <div class="right">
    <span id="interp" class="tag offline" title="how language is interpreted">interpreter: offline rules</span>
    <input id="pname" placeholder="project name">
    <button id="newproj" class="ghost" title="start a new project">New</button>
    <button id="undo" class="ghost" disabled title="undo (⌘Z)">Undo</button><button id="redo" class="ghost" disabled title="redo">Redo</button>
    <button id="export" class="ghost">Export…</button>
    <span id="savestate" class="faint small"></span>
  </div>
</div>
<button class="float" id="edge-left" title="open the conversation">Conversation</button>
<button class="float" id="edge-right" title="open the context panel">Context</button>
<div class="float" id="left"><div class="head"><h2>Conversation</h2><span class="sub">describe · correct · revise</span><div class="right"><button class="mini" id="demo" title="play the demonstration journey step by step">Demo journey</button><button class="mini ghost" data-close="left" title="hide">×</button></div></div>
  <div class="body" id="chatlog"></div>
  <div id="brief"></div>
  <form id="chatform"><textarea id="say" placeholder="Describe the site and what you want, or — after a design — circle an area and say what should change…"></textarea><div class="row"><button type="submit" class="primary">Send</button><label class="chip click"><input type="file" id="imgfile" accept="image/*" hidden>＋ photo / sketch</label><button type="button" class="mini" id="addr">＋ address</button><span class="hint grow" id="chathint"></span></div></form>
</div>
<div id="tools"></div><div id="quick"></div>
<div class="float" id="right"><div class="head"><h2>Context</h2><span class="sub" id="rsub"></span><div class="right"><button class="mini ghost" data-close="right" title="hide">×</button></div></div><div class="body" id="railbody"></div></div>
<div class="float" id="plantcard"></div>
<div id="legend"></div>
<div id="cfoot"></div>
<div class="float" id="viewbar"></div>
<div class="float" id="bottom"><div class="head"><div class="tabs" id="btabs"></div><div class="right"><span class="sub" id="bsub"></span><button class="mini ghost" id="btoggle">▴</button></div></div><div class="body" id="bbody"></div></div>
<div id="tip"></div>
<div id="loading"><div>loading the knowledge projection…<div id="err"></div></div></div>
<script type="module" src="./js/app-classic.js"></script>
</body>
</html>
