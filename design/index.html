<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planting Intelligence · Design Workspace</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f6f4ee; --panel: #fdfbf7; --panel-2: #f0ece2; --ink: #2a2723; --ink-2: #5f5a52; --ink-3: #9a948a; --line: rgba(42,39,35,.12); --line-2: rgba(42,39,35,.24);
    --olive: #5f7f62; --olive-deep: #44604a; --olive-soft: #dfe7dc; --sage: #8a9a80; --amber: #c08a2e; --amber-soft: #f3e4c6; --rust: #b4553a; --rust-soft: #f1dcd5; --violet: #7c6ea8; --sky: #4a7da5;
    --sans: -apple-system, "Helvetica Neue", "Segoe UI", Inter, Roboto, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  a { color: var(--olive-deep); } i.sci { font-style: italic; } h1, h2, h3, h4 { margin: 0; font-weight: 500; }
  button { font: 12px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; } button:hover { background: #fff; border-color: var(--line-2); } button.on { background: var(--olive-soft); border-color: var(--olive); color: var(--olive-deep); font-weight: 500; } button.primary { background: var(--olive-deep); color: #fff; border-color: var(--olive-deep); } button.primary:hover { background: var(--olive); } button:disabled { opacity: .45; cursor: default; } button.mini { padding: 1px 6px; font-size: 10.5px; border-radius: 4px; } button.danger { color: var(--rust); border-color: var(--rust); }
  input, select, textarea { font: 12.5px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none; } input:focus, select:focus, textarea:focus { border-color: var(--line-2); } input[type=range] { padding: 0; } input.num { width: 64px; }
  .kicker { font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); } .muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 11.5px; } .mono { font-family: var(--mono); font-size: 10.5px; } .warn { color: var(--rust); } .ok { color: var(--olive-deep); }
  .tag { display: inline-block; font: 10px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; vertical-align: middle; margin-right: 3px; }
  .tag.pass, .tag.documented, .tag.verified, .tag.user-stated, .tag.user-drawn, .tag.user-calibrated, .tag.user-accepted, .tag.supported_by_source { color: var(--olive-deep); border-color: var(--olive); } .tag.derived { color: var(--olive-deep); border-style: dashed; } .tag.candidate, .tag.conditional, .tag.assumed, .tag.inferred, .tag.unverified, .tag.partially_supported, .tag.interpretation_candidate { color: #8a6a1f; border-color: var(--amber); border-style: dashed; } .tag.unknown, .tag.not_recorded, .tag.not_assessed, .tag.none { color: var(--ink-3); border-style: dotted; } .tag.fail, .tag.conflict, .tag.error, .tag.refused, .tag.retired, .tag.conflicting_evidence, .tag.flag { color: var(--rust); background: var(--rust-soft); border-color: transparent; } .tag.offline { background: var(--panel-2); border-color: transparent; } .tag.live { background: var(--olive-soft); border-color: transparent; color: var(--olive-deep); }
  .note { font-size: 11.5px; color: var(--ink-2); background: rgba(255,255,255,.6); border-left: 2px solid var(--line-2); padding: 6px 9px; margin: 6px 0; border-radius: 0 6px 6px 0; } .note.warn { border-left-color: var(--rust); } .note.ok { border-left-color: var(--olive); }
  details { margin: 4px 0; } summary { cursor: pointer; color: var(--ink-2); font-size: 11.5px; } summary:hover { color: var(--ink); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.7); margin: 2px 2px 2px 0; } .chip.click { cursor: pointer; } .chip.click:hover { border-color: var(--line-2); background: #fff; } .chip small { font: 10px var(--mono); color: var(--ink-3); }
  .row { display: flex; gap: 8px; align-items: center; } .row.between { justify-content: space-between; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
  table.t { border-collapse: collapse; width: 100%; font-size: 11.5px; } table.t th, table.t td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; } table.t th { font: 10px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; } table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--panel-2); } table.t tr.sel td { background: var(--olive-soft); }

  #top { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #top h1 { font-size: 14px; white-space: nowrap; } #top h1 small { font: 10px var(--mono); color: var(--ink-3); letter-spacing: .12em; text-transform: uppercase; margin-left: 8px; }
  #top .crumbs { font: 11px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; } #top .right { margin-left: auto; display: flex; gap: 6px; align-items: center; } #pname { width: 170px; }
  #main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr 372px; grid-template-rows: minmax(0, 1fr) 232px; gap: 10px; padding: 10px 12px 12px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
  .pane > .head { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px 6px; border-bottom: 1px solid var(--line); } .pane > .head h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); } .pane > .head .sub { font-size: 11px; color: var(--ink-3); } .pane > .head .right { margin-left: auto; display: flex; gap: 5px; align-items: center; }
  .pane > .body { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px 12px; }
  #chat { grid-column: 1; grid-row: 1 / 3; } #canvas { grid-column: 2; grid-row: 1; } #rail { grid-column: 3; grid-row: 1 / 3; } #bottom { grid-column: 2; grid-row: 2; }

  /* conversation */
  #chat .body { display: flex; flex-direction: column; gap: 8px; } .msg { padding: 8px 10px; border-radius: 10px; font-size: 12.5px; max-width: 96%; } .msg.user { background: var(--amber-soft); align-self: flex-end; } .msg.ai { background: var(--olive-soft); align-self: flex-start; } .msg.sys { background: var(--panel-2); align-self: stretch; font-size: 11.5px; color: var(--ink-2); } .msg .m { font: 10px var(--mono); color: var(--ink-3); margin-top: 4px; } .msg ul { margin: 4px 0 0 16px; padding: 0; } .msg li { margin: 1px 0; }
  #chatform { flex: none; padding: 8px 12px 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; } #chatform textarea { width: 100%; min-height: 54px; resize: vertical; } #chatform .row { gap: 5px; flex-wrap: wrap; } #chatform .hint { font: 10.5px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #brief { padding: 6px 12px 10px; border-top: 1px solid var(--line); flex: none; max-height: 42%; overflow: auto; } #brief h3 { font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 6px 0 4px; } .vrow { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 6px; font-size: 11.5px; margin: 2px 0; } .vrow input[type=range] { width: 100%; }

  /* canvas */
  #canvas .body { padding: 0; position: relative; } #tools { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; flex-wrap: wrap; z-index: 3; max-width: calc(100% - 20px); } #tools button { backdrop-filter: blur(8px); background: rgba(253,251,247,.9); } #tools .sep { width: 1px; background: var(--line); margin: 0 3px; }
  #quick { position: absolute; right: 10px; top: 10px; z-index: 3; display: flex; gap: 4px; align-items: center; font-size: 11.5px; background: rgba(253,251,247,.92); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; } #quick input { width: 52px; }
  #svg { width: 100%; height: 100%; display: block; background: radial-gradient(ellipse at 50% 40%, #fbf9f3 0%, var(--panel) 70%); cursor: default; touch-action: none; } #svg.tool-draw, #svg.tool-lasso, #svg.tool-tree, #svg.tool-open, #svg.tool-bed, #svg.tool-site, #svg.tool-calibrate, #svg.tool-add { cursor: crosshair; } #svg.tool-pan { cursor: grab; }
  #svg text { font-family: var(--sans); paint-order: stroke; stroke: rgba(253,251,247,.9); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
  #svg .site { fill: rgba(255,255,255,.35); stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 6 3; } #svg .site.none { fill: none; stroke: var(--ink-3); }
  #svg .bed { fill: rgba(95,127,98,.08); stroke: var(--olive); stroke-width: 1.2; } #svg .bed.suggested { stroke-dasharray: 4 3; fill: rgba(192,138,46,.08); stroke: var(--amber); } #svg .bed.active { stroke-width: 2; }
  #svg .open { fill: rgba(42,39,35,.05); stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; } #svg .tree { fill: rgba(68,96,74,.12); stroke: var(--olive-deep); stroke-width: 1; stroke-dasharray: 2 3; } #svg .tree-centre { fill: var(--olive-deep); }
  #svg .zone { fill: none; stroke: var(--sky); stroke-width: 1; stroke-dasharray: 2 4; opacity: .7; } #svg .zone-label { font-size: 9.5px; fill: var(--sky); font-family: var(--mono); }
  #svg .plant { cursor: pointer; stroke-width: 1.1; fill-opacity: .72; } #svg .plant:hover { stroke-width: 2; } #svg .plant.sel { stroke: var(--ink); stroke-width: 2.2; } #svg .plant.locked { cursor: default; } #svg .plant.target { stroke: var(--amber); stroke-width: 2; } #svg .plant.removed { fill: none; stroke: var(--rust); stroke-dasharray: 3 2; stroke-width: 1.6; } #svg .plant.added { stroke: var(--olive-deep); stroke-width: 2.4; } #svg .plant.changed { stroke: var(--violet); stroke-width: 2.2; }
  #svg .plant-label { font-size: 8px; fill: var(--ink-2); } #svg .scope { fill: rgba(192,138,46,.12); stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 6 3; } #svg .lasso { fill: rgba(192,138,46,.1); stroke: var(--amber); stroke-width: 1.5; } #svg .draft { fill: rgba(95,127,98,.08); stroke: var(--olive); stroke-width: 1.2; stroke-dasharray: 4 3; }
  #svg .grid { stroke: rgba(42,39,35,.06); stroke-width: 1; } #svg .scalebar { stroke: var(--ink-2); stroke-width: 2; } #svg .north { fill: var(--ink-2); } #svg .overlay { opacity: .55; }
  #svg .iso-bed { fill: rgba(95,127,98,.14); stroke: var(--olive); } #svg .iso-site { fill: rgba(255,255,255,.4); stroke: var(--ink-3); stroke-dasharray: 5 3; } #svg .iso-plant { stroke-width: 1; } #svg .iso-stem { stroke: var(--ink-2); stroke-width: 1.4; } #svg .iso-open { fill: rgba(42,39,35,.05); stroke: var(--ink-3); stroke-dasharray: 3 3; } #svg .iso-tree { fill: rgba(68,96,74,.25); stroke: var(--olive-deep); } #svg .iso-unknown { stroke-dasharray: 2 2; fill-opacity: .25; }
  #cfoot { position: absolute; left: 10px; bottom: 8px; right: 10px; display: flex; gap: 10px; align-items: center; font: 10.5px var(--mono); color: var(--ink-3); pointer-events: none; } #cfoot .sp { flex: 1; } #cfoot b { color: var(--ink-2); font-weight: 500; }
  #tip { position: fixed; display: none; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font-size: 11.5px; max-width: 320px; z-index: 30; box-shadow: 0 4px 14px rgba(42,39,35,.12); } #tip .m { font: 10px var(--mono); color: var(--ink-3); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font: 10.5px var(--mono); color: var(--ink-3); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 3px; border: 1px solid var(--line-2); }

  /* rail */
  #rail .body { padding: 6px 10px 12px; } .sec { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: rgba(255,255,255,.5); } .sec > .h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); } .sec > .h .n { margin-left: auto; font: 10px var(--mono); color: var(--ink-3); text-transform: none; letter-spacing: 0; } .sec > .c { display: none; padding: 2px 10px 10px; border-top: 1px solid var(--line); font-size: 12px; } .sec.open > .c { display: block; } .sec.active > .h { color: var(--olive-deep); background: var(--olive-soft); border-radius: 8px 8px 0 0; }
  .field { display: grid; grid-template-columns: 84px 1fr; gap: 4px 8px; align-items: center; font-size: 11.5px; margin: 3px 0; } .field label { color: var(--ink-2); } .field .v { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; } .field select { padding: 1px 4px; font-size: 11px; max-width: 118px; }
  .why { font-size: 11.5px; padding: 5px 0; border-top: 1px solid var(--line); } .why b { font-weight: 500; } .why .m { font: 10.5px var(--mono); color: var(--ink-3); }
  .preview { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 12px; } .preview h4 { font-size: 12px; margin-bottom: 4px; } .preview .btns { display: flex; gap: 6px; margin-top: 6px; }
  .claim { padding: 5px 0; border-top: 1px solid var(--line); font-size: 11.5px; } .claim .m { font: 10.5px var(--mono); color: var(--ink-3); margin-top: 2px; }

  /* bottom */
  #bottom .head .tabs { display: flex; gap: 4px; } #bottom .head .tabs button.on { background: var(--olive-soft); }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink-3); font: 12px var(--mono); background: var(--bg); z-index: 50; } #loading.gone { display: none; } #err { color: var(--rust); white-space: pre-wrap; max-width: 600px; }
  @media (max-width: 1200px) { #main { grid-template-columns: 300px 1fr 330px; } }
  @media (max-width: 960px) { body { overflow: auto; height: auto; } #main { display: flex; flex-direction: column; } .pane { min-height: 300px; max-height: 70vh; } #canvas { height: 60vh; } #chat .body { max-height: 40vh; } }
</style>
</head>
<body>
<div id="top">
  <h1>Planting Intelligence <small>design workspace · phase 2</small></h1>
  <span class="crumbs" id="crumbs">Site</span>
  <div class="right">
    <span id="interp" class="tag offline" title="how language is interpreted">interpreter: offline rules</span>
    <input id="pname" placeholder="project name">
    <button id="newproj" title="start a new project">New</button>
    <button id="undo" disabled title="undo (⌘Z)">Undo</button><button id="redo" disabled title="redo">Redo</button>
    <button id="view2d" class="on">2D</button><button id="view3d">3D</button>
    <button id="export">Export…</button>
    <span id="savestate" class="faint small"></span>
  </div>
</div>
<div id="main">
  <div class="pane" id="chat"><div class="head"><h2>Conversation</h2><span class="sub">describe · correct · revise</span><div class="right"><button class="mini" id="demo" title="fill the demonstration journey step by step">Demo journey</button></div></div>
    <div class="body" id="chatlog"></div>
    <div id="brief"></div>
    <form id="chatform"><textarea id="say" placeholder="Describe the site and what you want, or — after a design — circle an area and say what should change…"></textarea><div class="row"><button type="submit" class="primary">Send</button><label class="chip click"><input type="file" id="imgfile" accept="image/*" hidden>＋ photo / sketch</label><button type="button" class="mini" id="addr">＋ address</button><span class="hint grow" id="chathint"></span></div></form>
  </div>
  <div class="pane" id="canvas"><div class="head"><h2>Design canvas</h2><span class="sub" id="csub"></span><div class="right"><span class="legend" id="legend"></span></div></div>
    <div class="body">
      <div id="tools"></div><div id="quick"></div>
      <svg id="svg"></svg>
      <div id="cfoot"></div>
    </div>
  </div>
  <div class="pane" id="rail"><div class="head"><h2>Context</h2><span class="sub" id="rsub"></span></div><div class="body" id="railbody"></div></div>
  <div class="pane" id="bottom"><div class="head"><div class="tabs" id="btabs"></div><div class="right"><span class="sub" id="bsub"></span></div></div><div class="body" id="bbody"></div></div>
</div>
<div id="tip"></div>
<div id="loading"><div>loading the knowledge projection…<div id="err"></div></div></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
