<style>
  :root {

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); overflow: hidden; }

  button:hover { background: rgba(255,255,255,.12); color: #fff; } button:disabled { opacity: .35; cursor: default; } button.primary { background: rgba(255,241,194,.14); border-color: rgba(255,241,194,.35); }
  input, textarea, select { font: 12.5px var(--sans); color: var(--ink); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; width: 100%; }

  /* one label per visible sphere */

  .lbl { position: absolute; transform: translate(-50%, 0); white-space: nowrap; color: var(--ink); font-size: 11.5px; line-height: 1.2; pointer-events: auto; cursor: pointer; text-shadow: 0 0 6px rgba(4,6,15,1), 0 0 2px rgba(4,6,15,1), 0 1px 2px rgba(4,6,15,1); text-align: center; transition: opacity .3s; }

  .lbl.axis.x, .lbl.cat.x { color: var(--x); } .lbl.axis.y, .lbl.cat.y { color: var(--y); } .lbl.axis.z, .lbl.cat.z { color: var(--z); } .lbl.axis.e, .lbl.cat.e { color: var(--e); }

  #hud { position: fixed; inset: 0; pointer-events: none; } #hud > * { pointer-events: auto; }

  #brand h1 small { color: var(--ink-faint); font-weight: 400; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; margin-left: 10px; } #brand h1 small a { color: var(--ink-dim); border: 0; }
  #stats { font: 10.5px var(--mono); color: var(--ink-faint); margin-top: 4px; }
  #crumb { margin-top: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  #crumb button { font-size: 11px; padding: 3px 8px; } #crumb .path { color: var(--ink-dim); } #crumb .path .link { color: #e8ecf5; cursor: pointer; } #crumb .path .link:hover { color: #fff; text-decoration: underline; } #crumb .path i { color: var(--ink-faint); font-style: normal; margin: 0 5px; } #crumb .faint { color: var(--ink-faint); }
  #state { font: 11px var(--mono); color: var(--ink-dim); margin-top: 6px; min-height: 14px; }

  #askbar { position: absolute; right: 20px; top: 16px; width: 380px; display: flex; gap: 6px; align-items: center; }
  #askbar input { background: var(--glass); border-color: rgba(190,205,255,.18); } #askbar button { white-space: nowrap; background: var(--glass); }

  #legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; } #legend i.ln { width: 14px; height: 2px; border-radius: 0; }

  /* the card: only after a click, compact, closable */
  #card { position: absolute; right: 20px; bottom: 50px; width: 350px; max-height: min(56vh, 520px); overflow: auto; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 12px; display: none; }
  #card.open { display: block; }
  #card h2 { margin: 0 0 2px; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 20px; } #card h2 em { font-style: italic; }

  #card h3 { margin: 12px 0 5px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); font-weight: 500; display: flex; align-items: center; gap: 8px; } #card h3 .step { font-family: var(--mono); color: var(--ink-faint); letter-spacing: 0; } #card h3.warn { color: #ff8c6b; }
  #card p { margin: 6px 0; } #card .lead { font-size: 12.5px; color: #e8ecf5; } #card .muted { color: var(--ink-dim); } #card .small { font-size: 11.5px; } #card .faint { color: var(--ink-faint); }
  #card .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 2px; }
  #card .row { display: flex; gap: 8px; padding: 5px 6px; margin: 1px -6px; border-radius: 4px; cursor: pointer; align-items: flex-start; } #card .row:hover { background: rgba(255,255,255,.06); } #card .row.dim { opacity: .55; }
  #card .row .st { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--c); } #card .row .st.unverified, #card .row .st.candidate, #card .row .st.derived { background: transparent; border: 1.5px solid var(--c); } #card .row .st.candidate { border-style: dashed; } #card .row .st.unknown { background: transparent; border: 1.5px dotted var(--c); }
  #card .val { color: #e8ecf5; } #card .meta { font: 10.5px var(--mono); color: var(--ink-dim); } #card .meta.warn { color: #ff8c6b; }
  #card .chips { display: flex; flex-wrap: wrap; gap: 4px; } #card .chip { font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--c); color: var(--ink); cursor: pointer; background: rgba(255,255,255,.03); } #card .chip:hover { background: rgba(255,255,255,.1); } #card .chip small { color: var(--ink-dim); font-family: var(--mono); margin-left: 3px; } #card .chip.dim { opacity: .45; } #card .chip.on { background: rgba(255,255,255,.12); }
  #card .tag { font: 10px var(--mono); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-dim); } #card .tag.candidate { color: var(--inferred); border-color: var(--inferred); } #card .tag.derived { color: var(--derived); border-color: var(--derived); } #card .tag.unknown { color: var(--unknown); border-color: var(--unknown); } #card .tag.supported, #card .tag.verified, #card .tag.documented { color: #6ff2b0; border-color: rgba(111,242,176,.4); }
  #card details { margin-top: 6px; } #card summary { cursor: pointer; color: var(--ink-dim); font-size: 11.5px; } #card summary:hover { color: #fff; }
  #card .link { color: #9fd3ff; cursor: pointer; } #card .warn { color: #ff8c6b; } #card .cand { color: var(--candidate); }
  #card .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; } #card label { font: 10px var(--mono); color: var(--ink-faint); display: block; margin-bottom: 2px; }

  #card .r { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12px; cursor: pointer; } #card .r .why { font: 10px var(--mono); color: var(--ink-faint); }

  #card .trail { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; } #card .trail .w { font: 10px var(--mono); color: var(--ink-dim); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; opacity: .35; animation: lit .4s forwards; } #card .trail .w small { color: var(--ink-faint); } @keyframes lit { to { opacity: 1; color: #fff; } }
